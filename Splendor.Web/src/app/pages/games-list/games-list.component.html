<div class="container">
  <div class="header-section">
    <h1>Splendor - Games</h1>
    <div class="create-game">
      <input [(ngModel)]="newGameName" maxlength="40" placeholder="Game name (optional)" data-testid="game-name-input">
      <select [(ngModel)]="turnDurationSeconds" data-testid="turn-duration-select">
        <option [ngValue]="30">30 s / turn</option>
        <option [ngValue]="60">60 s / turn</option>
        <option [ngValue]="120">120 s / turn</option>
        <option [ngValue]="300">300 s / turn</option>
      </select>
      <button (click)="createNewGame()" class="btn-primary" data-testid="create-game-btn">+ New Game</button>
      <button (click)="watchBotMatch()" [disabled]="hasBotMatch()" class="btn-secondary" data-testid="watch-bot-match-btn">Watch bot vs bot</button>
    </div>
  </div>

  <div class="games-grid">
    <div *ngFor="let game of games" class="game-card" data-testid="game-card">
      <div class="card-header">
        <h3>{{ game.name || 'Game #' + game.id.substring(0, 8) }}</h3>
        <span class="status-badge" [class]="game.status.toLowerCase()">{{ game.status }}</span>
      </div>
      <p class="players-info">Players: <strong>{{ game.playerCount }}</strong> / 4</p>
      <div class="card-actions">
        <button (click)="goToGame(game)" class="btn-secondary" data-testid="open-game-btn">
          {{ game.status === 'Created' ? 'Join / Lobby' : 'Open Game' }}
        </button>
        <button (click)="deleteGame(game, $event)" class="btn-danger" data-testid="delete-game-btn">
          Delete
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="games.length === 0" class="no-games" data-testid="no-games-message">
    No active games found. Create one to start!
  </div>
</div>
