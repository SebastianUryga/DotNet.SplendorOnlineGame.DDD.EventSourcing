<header class="app-header">
  <div class="logo">Splendor Online</div>
  <div class="auth-box">
    <input [(ngModel)]="token" placeholder="Paste JWT Token here..." class="token-input" (keyup.enter)="saveToken()" data-testid="token-input" />
    <button (click)="saveToken()" class="btn-save" data-testid="set-token-btn">Set Token</button>
    <button (click)="playAsGuest()" class="btn-save" data-testid="guest-btn">Play as guest</button>
    <span class="status-text" *ngIf="guestError" data-testid="guest-error">{{ guestError }}</span>
    <div class="status-indicator">
      <span class="status-dot" [class.valid]="hasToken"></span>
      <span class="status-text">{{ hasToken ? 'Authenticated' : 'No Token' }}</span>
    </div>
  </div>
</header>

<main class="content-area">
  <router-outlet></router-outlet>
</main>

<footer class="app-footer">
  Splendor DDD Event Sourcing Project &copy; 2026
</footer>

<div class="modal-backdrop" *ngIf="authService.loginRequired$ | async" data-testid="login-dialog">
  <div class="modal">
    <h2>Session expired</h2>
    <p>Sign in to continue. Guest sessions last 60 minutes, and a new guest starts without the previous guest's games.</p>
    <button (click)="playAsGuest(true)" class="btn-save" data-testid="dialog-guest-btn">Play as guest</button>
    <span class="status-text" *ngIf="guestError">{{ guestError }}</span>
    <div class="modal-token">
      <input [(ngModel)]="token" placeholder="Paste JWT Token here..." class="token-input" (keyup.enter)="saveToken(true)" data-testid="dialog-token-input" />
      <button (click)="saveToken(true)" class="btn-save" data-testid="dialog-set-token-btn">Set Token</button>
    </div>
    <button (click)="authService.dismissLogin()" class="btn-close" data-testid="dialog-close-btn">Close</button>
  </div>
</div>

<div class="toasts">
  <div class="toast" *ngFor="let t of toastService.toasts$ | async" data-testid="toast">{{ t.text }}</div>
</div>
