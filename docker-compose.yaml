version: '3.8'

services:
  splendor-postgres:
    image: postgres:16
    container_name: splendor-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=splendor
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: splendor-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    container_name: splendor-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: always

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: splendor-aspire-dashboard
    ports:
      - "18888:18888"
      - "4317:18889"
      - "4318:18890"
    restart: unless-stopped

volumes:
  postgres-data:
    external: true
    name: splendor_postgres-data
