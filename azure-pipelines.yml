trigger:
  - main

pr:
  - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: UseDotNet@2
    displayName: Install .NET 10 SDK
    inputs:
      packageType: sdk
      version: 10.0.x

  - script: >
      dotnet build Splendor.Api/Splendor.Api.csproj
      --configuration Release
    displayName: Build API

  - script: >
      dotnet build Splendor.BotWorker/Splendor.BotWorker.csproj
      --configuration Release
    displayName: Build bot worker

  - script: >
      dotnet test Splendor.UnitTests/Splendor.UnitTests.csproj
      --configuration Release
      --logger trx
      --results-directory "$(Agent.TempDirectory)/test-results/unit"
    displayName: Run unit tests

  - script: docker info
    displayName: Check Docker for Testcontainers

  - script: >
      dotnet test Splendor.IntegrationTests/Splendor.IntegrationTests.csproj
      --configuration Release
      --logger trx
      --results-directory "$(Agent.TempDirectory)/test-results/integration"
    displayName: Run integration tests

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '**/*.trx'
      searchFolder: '$(Agent.TempDirectory)/test-results'
      failTaskOnFailedTests: true

  - script: >
      dotnet publish Splendor.Api/Splendor.Api.csproj
      --configuration Release
      --no-restore
      --output "$(Build.ArtifactStagingDirectory)/api"
    displayName: Publish API files

  - task: PublishPipelineArtifact@1
    displayName: Upload API artifact
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/api'
      artifact: splendor-api